server:
  address: 127.0.0.1
  port: ${LEASEGUARD_HTTP_PORT:18084}
  servlet:
    context-path: /api

spring:
  application:
    name: drone-rental

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LEASEGUARD_DB_URL}
    username: ${LEASEGUARD_DB_USER}
    password: ${LEASEGUARD_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    url: ${LEASEGUARD_DB_URL}
    user: ${LEASEGUARD_MIGRATION_USER}
    password: ${LEASEGUARD_MIGRATION_PASSWORD}
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # MVC 配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.drone.rental.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置
jwt:
  secret: ${LEASEGUARD_JWT_SECRET}
  expiration: 86400000  # 24小时 (毫秒)
  header: Authorization
  prefix: Bearer

# Swagger 配置
swagger:
  enabled: true
  title: 无人机租赁系统API
  description: 无人机租赁系统后端接口文档
  version: 1.0.0

# 文件上传配置
file:
  upload-path: ${LEASEGUARD_UPLOAD_PATH:uploads/}
  access-url: /uploads/

# 日志配置
logging:
  level:
    com.drone.rental: info
    com.drone.rental.mapper: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Explicit opt-in: protects existing fixtures and keeps tests deterministic.
leaseguard:
  jobs:
    enabled: ${LEASEGUARD_JOBS_ENABLED:false}
    timeout-seconds: ${LEASEGUARD_JOB_TIMEOUT_SECONDS:1800}
    lease-seconds: 30
    max-attempts: 5
    backoff-seconds: 2
    poll-millis: 1000
